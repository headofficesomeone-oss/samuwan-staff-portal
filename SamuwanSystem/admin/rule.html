<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SamuwanAdmin｜規定値管理</title>
  <link rel="stylesheet" href="./rule-admin.css?v=20261001-v33a">
</head>
<body>
<header class="rule-fixed-header">
  <div class="rule-header-main">
    <div>
      <h1>SamuwanAdmin <span style="font-size:14px;font-weight:700;color:#65756c">／ 規定値管理</span></h1>
      <p id="headerReporter">職員情報確認中...</p>
    </div>
    <div class="header-actions">
      <button id="reloadButton" type="button" class="sub-button">更新</button>
      <button id="addRuleButton" type="button" class="main-button">＋ 規定値を追加</button>
    </div>
  </div>
  <nav class="samuwan-page-nav" aria-label="画面移動">
    <a href="./index.html">管理トップ</a>
    <a class="active" href="./rule.html">規定値管理</a>
    <a href="../index.html">ポータル</a>
  </nav>
</header>

<main class="rule-page">
  <section class="toolbar">
    <label class="toolbar-search"><span>検索</span><input id="filterText" type="search" placeholder="利用者・サービス・担当者で検索"></label>
    <label><span>曜日</span><select id="weekdayFilter"><option value="">全曜日</option><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option><option>土</option><option>日</option></select></label>
    <label><span>制度</span><select id="systemFilter"><option value="">全制度</option></select></label>
    <label class="active-filter"><input id="activeOnly" type="checkbox" checked><span>有効のみ</span></label>
    <div class="toolbar-count"><b id="rowCount">0</b><span>件</span></div>
  </section>

  <section class="info-strip">
    <span>基本情報は「変更」、担当・運転手・車両・曜日は一覧から即時保存します。</span>
    <b id="saveStatus">準備中...</b>
  </section>

  <section class="sheet-wrap">
    <table class="rule-sheet" id="ruleTable">
      <thead>
        <tr>
          <th class="sticky c-weekday">曜日</th>
          <th class="sticky c-client">利用者</th>
          <th class="sticky c-system">制度</th>
          <th class="sticky c-service">サービス</th>
          <th class="sticky c-start">開始</th>
          <th class="sticky c-end">終了</th>
          <th class="c-staff">主担当</th>
          <th class="c-staff">担当2</th>
          <th class="c-staff">担当3</th>
          <th class="c-driver">行きドライバー</th>
          <th class="c-vehicle">行き車両</th>
          <th class="c-driver">帰りドライバー</th>
          <th class="c-vehicle">帰り車両</th>
          <th class="c-driver">前送迎ドライバー</th>
          <th class="c-vehicle">前送迎車両</th>
          <th class="c-driver">後送迎ドライバー</th>
          <th class="c-vehicle">後送迎車両</th>
          <th class="c-action">操作</th>
        </tr>
      </thead>
      <tbody id="ruleTableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" hidden>条件に一致する規定値がありません。</div>
  </section>
</main>

<dialog id="addDialog" class="edit-dialog">
  <form id="addForm" method="dialog">
    <div class="dialog-head">
      <div><strong>規定値を追加</strong><span>第1段階：基本情報だけ登録します。</span></div>
      <button type="button" class="dialog-close" data-close="addDialog">×</button>
    </div>
    <div class="dialog-body">
      <div class="form-grid two">
        <label><span>曜日</span><select id="addWeekday" required><option value="">選択してください</option><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option><option>土</option><option>日</option></select></label>
        <label><span>利用者</span><select id="addClient" required></select></label>
        <label><span>制度</span><select id="addSystem" required></select></label>
        <label><span>サービス</span><select id="addService" required></select></label>
        <label><span>開始</span><input id="addStart" type="time" required></label>
        <label><span>終了</span><input id="addEnd" type="time" required></label>
      </div>
      <div class="dialog-note">登録後、主担当・担当2・担当3・運転手・車両は一覧上のプルダウンから設定します。</div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="sub-button" data-close="addDialog">キャンセル</button>
      <button id="addSaveButton" type="submit" class="main-button">登録</button>
    </div>
  </form>
</dialog>

<dialog id="basicEditDialog" class="edit-dialog">
  <form id="basicEditForm" method="dialog">
    <div class="dialog-head">
      <div><strong>基本情報を変更</strong><span id="basicEditTitle">－</span></div>
      <button type="button" class="dialog-close" data-close="basicEditDialog">×</button>
    </div>
    <div class="dialog-body">
      <input id="editRuleId" type="hidden">
      <div class="form-grid two">
        <label><span>制度</span><select id="editSystem" required></select></label>
        <label><span>サービス</span><select id="editService" required></select></label>
        <label><span>開始</span><input id="editStart" type="time" required></label>
        <label><span>終了</span><input id="editEnd" type="time" required></label>
      </div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="sub-button" data-close="basicEditDialog">キャンセル</button>
      <button id="basicEditSaveButton" type="submit" class="main-button">変更する</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="./rule-admin.js?v=20261001-v33a"></script>
</body>
</html>
