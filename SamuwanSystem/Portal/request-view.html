<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>依頼情報</title>
  <link rel="stylesheet" href="./css/request-view.css?v=20260826-1">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="title-row">
        <div>
          <div class="title">依頼情報</div>
          <div class="sub" id="weekLabel">読み込み中...</div>
        </div>

        <div class="scope-toggle" aria-label="表示範囲">
          <button type="button" class="scope-btn active" data-scope="all">全体</button>
          <button type="button" class="scope-btn" data-scope="mine">自分</button>
        </div>
      </div>

      <div class="days" id="daysNav"></div>
    </header>

    <section class="content">
      <div class="day-head">
        <strong id="dayTitle">－</strong>
        <span class="count" id="dayCount">0件</span>
      </div>

      <div class="message" id="message">依頼情報を取得しています...</div>
      <div class="list" id="requestList"></div>
    </section>
  </main>

  <script src="./js/request-view_config.js?v=20260826-1"></script>
  <script src="./js/request-view.js?v=20260826-1"></script>
</body>
</html>
