<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samuwan Staff Portal</title>
  <link rel="stylesheet" href="./css/common.css?v=20260824-1534-phase7">
  <link rel="stylesheet" href="./css/portal-layout.css?v=20260905-1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ===== Samuwan 共通画面移動（今回追加分） ===== */
.samuwan-page-nav{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  padding:8px 10px;
  background:#fff;
  border-bottom:1px solid #dfe5ea;
}
.samuwan-page-nav-link{
  min-width:0;
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  border:1px solid #dfe5ea;
  border-radius:9px;
  background:#f7f9fa;
  color:#46515d;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}
.samuwan-page-nav-link.active{
  background:#eaf2fb;
  border-color:#9fc1e6;
  color:#2463a8;
}
@media(max-width:480px){
  .samuwan-page-nav{
    gap:4px;
    padding:6px;
  }
  .samuwan-page-nav-link{
    min-height:36px;
    font-size:10px;
    padding:0 2px;
  }
}
</style>

<script>
(function(){
  try{
    var d=new Date();
    var key=[
      d.getFullYear(),
      String(d.getMonth()+1).padStart(2,'0'),
      String(d.getDate()).padStart(2,'0')
    ].join('-');
    var raw=localStorage.getItem('samuwanPortalWorkSnapshotV1');
    if(!raw)return;
    var s=JSON.parse(raw);
    if(s && s.date===key && s.commuteLabel){
      document.documentElement.setAttribute('data-commute-saved','1');
    }
  }catch(e){}
})();
</script>

</head>
<body>
  <header class="app-header">
    <div>
      <div class="app-title">Samuwan Staff Portal</div>
      <div id="staffName" class="staff-name">本人確認中...</div>
    </div>

    <button id="workToggleButton" class="work-toggle hidden" type="button">
      始業
    </button>
  </header>

  <main class="app-main">
    <section id="loadingView" class="card">
      <h2>本人確認中です</h2>
      <p class="help">LINEの登録情報を確認しています。そのままお待ちください。</p>
    </section>

    <section id="registerView" class="card hidden">
      <h2>初回登録・本人確認</h2>
      <p class="help">ご自身の氏名を選択し、仮登録IDを発行してください。</p>

      <label class="field">
        <span>氏名</span>
        <select id="employeeName">
          <option value="">氏名一覧を読み込んでいます...</option>
        </select>
      </label>

      <button id="issueTempButton" class="secondary-button" type="button">
        仮登録IDを発行する
      </button>

      <label class="field">
        <span>仮登録ID</span>
        <input id="tempId" type="password" autocomplete="off" placeholder="LINEに届いた仮登録ID">
      </label>

      <button id="registerButton" class="primary-button" type="button">
        確認する
      </button>

      <div id="authMessage" class="message" aria-live="polite"></div>
    </section>

    <section id="completeView" class="card hidden">
      <h2>登録が完了しました</h2>
      <p id="completeMessage">LINE IDの登録が完了しました。</p>
      <button id="toPortalButton" class="primary-button" type="button">
        ポータルへ進む
      </button>
    </section>

    <section id="portalView" class="hidden">
<nav class="samuwan-page-nav" aria-label="画面移動">
  <a class="samuwan-page-nav-link" href="./request.html">新規依頼</a>
  <a class="samuwan-page-nav-link" href="./request-view.html">依頼情報</a>
  <a class="samuwan-page-nav-link" href="./shift-view.html">シフト一覧</a>
  <a class="samuwan-page-nav-link" href="./office_new.html">シフト表</a>
</nav>
      <section class="status-card work-card">
        <div class="status-heading">
          <h2>勤務状態</h2>
          <span id="workStateLabel" class="work-state-badge">未始業</span>
        </div>
        <div id="workTimeDetail" class="current-detail"></div>
        <div id="workPermissionNotice" class="permission-notice"></div>
        <div id="workCommuteSummary" class="work-commute-summary hidden"></div>
      </section>

      <section id="commuteCard" class="status-card commute-card">
        <div class="status-heading"><h2>勤務開始場所</h2></div>
        <label class="field"><span>今日最初に向かう場所</span><select id="commuteDestination"><option value="">読み込み中...</option></select></label>
        <div id="commuteResult" class="commute-result">勤務開始場所を選択してください。</div>
        <div id="commuteMessage" class="message" aria-live="polite"></div>
      </section>

      <section class="portal-section portal-business-section">
        <div class="portal-section-head">
          <h2>業務操作</h2>
          <span class="portal-business-notice">未始業の場合は、先に「始業」を行ってください。</span>
        </div>

        <div class="portal-business-grid">
          <button class="menu-button portal-business-button primary" data-page="action" type="button">
            <strong>行動記録</strong>
            <small>支援中の記録</small>
          </button>

          <button class="menu-button portal-business-button" data-page="office" type="button">
            <strong>事務作業</strong>
            <small>事務・記録</small>
          </button>

          <button class="menu-button portal-business-button" data-page="meeting" type="button">
            <strong>会議記録</strong>
            <small>会議・打合せ</small>
          </button>
        </div>
      </section>

      <section class="status-card">
        <div class="status-heading">
          <h2>現在の行動状態</h2>
          <button id="refreshButton" class="small-button" type="button">更新</button>
        </div>
        <div id="currentStatus" class="current-status">確認中...</div>
        <div id="currentDetail" class="current-detail"></div>
      </section>



      <section id="message" class="message" aria-live="polite"></section>
    </section>
  </main>

  <nav id="bottomNav" class="bottom-nav hidden">
    <button type="button" data-page="home">ホーム</button>
    <button type="button" data-page="mypage">マイページ</button>
  </nav>

  <script src="./js/common.js?v=20260824-1534-phase7"></script>
  <script src="./js/samuwan-data-cache.js?v=20260905-2"></script>
  <script src="./js/auth.js?v=20260824-1534-phase7"></script>
  <script src="./js/portal.js?v=20260824-1534-phase7"></script>
  <script src="./js/portal-work-snapshot.js?v=20260905-1"></script>

  <script>
  window.addEventListener('load', () => {
    const run = () => {
      window.SamuwanLocalData
        ?.prefetchPortalInitial()
        .catch(() => {});
    };

    if ('requestIdleCallback' in window) {
      requestIdleCallback(
        run,
        { timeout: 2500 }
      );
    } else {
      setTimeout(
        run,
        1200
      );
    }
  });
  </script>

</body>
</html>
