<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>依頼情報デバッグ</title>
<style>
body{font-family:sans-serif;padding:16px;line-height:1.6}
pre{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px}
button{padding:10px 14px;margin:4px}
.ok{background:#effbef}.ng{background:#fff0f0}
</style>
</head>
<body>
<h1>依頼情報デバッグ</h1>
<p>通常画面が止まる場合、GAS応答だけを確認できます。</p>
<button id="masters">request.masters</button>
<button id="range">request.range</button>
<pre id="out">待機中</pre>
<script src="./js/request-view-config.js?v=20260829-13"></script>
<script>
const out=document.getElementById('out');
async function post(data){
  const url=window.REQUEST_APP?.GAS_URL;
  if(!url) throw new Error('GAS_URLがありません');
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});
  const t=await r.text();
  let j; try{j=JSON.parse(t)}catch(e){throw new Error('JSONではありません: '+t.slice(0,300))}
  return j;
}
document.getElementById('masters').onclick=async()=>{
  out.className=''; out.textContent='request.masters 送信中...';
  try{const j=await post({action:'request.masters'});out.className='ok';out.textContent=JSON.stringify(j,null,2).slice(0,8000)}
  catch(e){out.className='ng';out.textContent=String(e.stack||e)}
};
document.getElementById('range').onclick=async()=>{
  out.className=''; out.textContent='request.range 送信中...';
  const now=new Date(), endDate=new Date(now); endDate.setDate(endDate.getDate()+21);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  try{const j=await post({action:'request.range',startDate:fmt(now),endDate:fmt(endDate),scope:'all',employeeId:''});out.className='ok';out.textContent=JSON.stringify(j,null,2).slice(0,8000)}
  catch(e){out.className='ng';out.textContent=String(e.stack||e)}
};
</script>
</body>
</html>
