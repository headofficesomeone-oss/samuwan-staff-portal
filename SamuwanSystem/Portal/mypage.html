<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>マイページ | Samuwan Staff Portal</title>
  <link rel="stylesheet" href="./css/mypage.css?v=20260904-2">
</head>
<body>

<header class="mypage-header">
  <div>
    <h1>マイページ</h1>
    <div id="mypageStaffName" class="mypage-staff-name">職員情報を確認しています...</div>
  </div>
</header>

<main class="mypage-main">

  <section class="mypage-work-summary">
    <div class="mypage-work-line">
      <span class="mypage-work-label">本日</span>
      <strong id="mypageTodayWork">勤務情報を確認しています...</strong>
    </div>
    <div class="mypage-work-line">
      <span class="mypage-work-label">前回</span>
      <strong id="mypagePreviousWork">—</strong>
    </div>
  </section>


  <section class="mypage-card">
    <div class="mypage-section-head">
      <div>
        <h2>自分の情報・申請</h2>
        <p>項目ごとの現在状況を確認します。</p>
      </div>
    </div>

    <div class="mypage-service-list">

      <button type="button" class="mypage-service-row" disabled>
        <span class="mypage-service-main">
          <strong>給与明細</strong>
          <small>最新の給与明細を確認</small>
        </span>
        <span class="mypage-service-status muted">準備中</span>
        <span class="mypage-arrow">›</span>
      </button>

      <button type="button" id="mypageLeaveButton" class="mypage-service-row">
        <span class="mypage-service-main">
          <strong>休暇・届出</strong>
          <small>休暇申請・各種届出</small>
        </span>
        <span class="mypage-service-status">ホームで利用</span>
        <span class="mypage-arrow">›</span>
      </button>

      <button type="button" class="mypage-service-row" disabled>
        <span class="mypage-service-main">
          <strong>労働実績</strong>
          <small>勤務時間・支援実績を確認</small>
        </span>
        <span class="mypage-service-status muted">準備中</span>
        <span class="mypage-arrow">›</span>
      </button>

      <button type="button" class="mypage-service-row" disabled>
        <span class="mypage-service-main">
          <strong>研修報告</strong>
          <small>受講状況・研修報告を確認</small>
        </span>
        <span class="mypage-service-status muted">準備中</span>
        <span class="mypage-arrow">›</span>
      </button>

      <button type="button" class="mypage-service-row" disabled>
        <span class="mypage-service-main">
          <strong>相談・連絡</strong>
          <small>相談・連絡事項を確認</small>
        </span>
        <span class="mypage-service-status muted">準備中</span>
        <span class="mypage-arrow">›</span>
      </button>

    </div>
  </section>

  <section class="mypage-card">
    <div class="mypage-section-head">
      <div>
        <h2>登録情報</h2>
        <p>職員ポータルで利用している本人情報です。</p>
      </div>
    </div>

    <dl class="account-list">
      <div>
        <dt>職員名</dt>
        <dd id="accountEmployeeName">—</dd>
      </div>
      <div>
        <dt>従業員ID</dt>
        <dd id="accountEmployeeId">—</dd>
      </div>
      <div>
        <dt>LINE連携</dt>
        <dd>登録済み</dd>
      </div>
    </dl>
  </section>

  <section class="mypage-card account-settings-card">
    <div class="mypage-section-head">
      <div>
        <h2>アカウント設定</h2>
        <p>LINE登録など、職員ポータルの登録に関する設定です。</p>
      </div>
    </div>

    <div class="account-note">
      LINE登録を解除した場合は、次回利用時に仮登録IDによる再登録が必要になります。
    </div>
  </section>

</main>

<nav class="mypage-bottom-nav">
  <a href="./index.html">ホーム</a>
  <a href="./mypage.html" class="active">マイページ</a>
</nav>

<script src="./js/mypage.js?v=20260904-3"></script>
</body>
</html>
