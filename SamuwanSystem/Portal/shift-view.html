<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>シフト一覧</title>
  <link rel="stylesheet" href="./css/shift-view.css?v=20260831-08">
</head>
<body>

<div class="app">

  <header class="header">

    <div class="title-row">

      <div>
        <div class="title">シフト一覧</div>
        <div id="weekLabel" class="sub">読み込み中...</div>
      </div>

      <div class="header-actions">

        <button
          id="confirmWeekButton"
          class="register-btn confirm-week-btn"
          type="button"
          hidden
        >
          週を確定
        </button>

        <a class="register-btn shift-request-link" href="./request-view.html">
          依頼情報
        </a>

      </div>

    </div>


    <div class="shift-week-info">
      <span id="weekState" class="shift-week-state">状態確認中</span>
      <span id="weekSource" class="shift-week-source"></span>
    </div>


    <div class="week-nav-row">

      <button
        id="prevWeek"
        class="week-nav-btn"
        type="button"
      >
        ‹
      </button>

      <div id="daysNav" class="days"></div>

      <button
        id="nextWeek"
        class="week-nav-btn"
        type="button"
      >
        ›
      </button>

    </div>


    <div class="selected-day-row">
      <div id="dayTitle" class="selected-day-title">-</div>
      <div class="day-tools">
        <div class="shift-view-toggle">
          <button id="timeViewButton" type="button" class="shift-view-btn active">時間順</button>
          <button id="staffViewButton" type="button" class="shift-view-btn">従業員別</button>
        </div>
        <span id="dayCount" class="count">0件</span>
      </div>
    </div>

  </header>


  <main class="content">

    <div id="message" class="message">
      シフトを取得しています...
    </div>

    <div id="shiftList" class="list"></div>

  </main>

</div>


<!-- 担当変更 -->
<dialog id="staffChangeDialog" class="request-dialog">
  <form id="staffChangeForm" class="request-form">

    <div class="form-head">
      <strong>担当変更</strong>
      <button type="button" id="closeStaffChangeDialog" class="close-btn">×</button>
    </div>

    <div class="form-body">

      <div id="staffChangeSummary" class="dialog-summary"></div>

      <div class="staff-current-grid">
        <div class="staff-current-cell">
          <span>人数</span>
          <b id="currentPeople">1</b>
        </div>
        <div class="staff-current-cell">
          <span>主担当</span>
          <b id="currentMain">－</b>
        </div>
        <div class="staff-current-cell">
          <span>担当2</span>
          <b id="currentStaff2">－</b>
        </div>
        <div class="staff-current-cell">
          <span>担当3（見習）</span>
          <b id="currentStaff3">－</b>
        </div>
        <div class="staff-current-cell">
          <span>行ドライバ</span>
          <b id="currentOutDriver">－</b>
        </div>
        <div class="staff-current-cell">
          <span>帰ドライバ</span>
          <b id="currentBackDriver">－</b>
        </div>
      </div>

      <label class="field">
        <span>変更する項目</span>
        <select id="staffChangeField" required>
          <option value="">選択してください</option>
          <option value="main">主担当</option>
          <option value="staff2">担当2</option>
          <option value="staff3">担当3（見習）</option>
          <option value="outDriver">行ドライバ</option>
          <option value="backDriver">帰ドライバ</option>
        </select>
      </label>

      <div class="staff-change-current-line">
        <span>変更前</span>
        <b id="staffChangeOld">－</b>
      </div>

      <label class="field">
        <span>変更後</span>
        <select id="staffChangeNew" required>
          <option value="">選択してください</option>
          <option
            value="__CLEAR__"
            data-clear-option="true"
            data-name=""
          >
            空欄にする
          </option>
        </select>
      </label>

      <div id="staffConflictArea" class="staff-conflict-area" hidden>
        <div id="staffConflictTitle" class="staff-conflict-title"></div>
        <div id="staffConflictList" class="staff-conflict-list"></div>
      </div>

      <label class="field">
        <span>変更理由</span>
        <textarea id="staffChangeReason" rows="2"></textarea>
      </label>

      <div class="form-actions">
        <button type="button" id="cancelStaffChange" class="secondary-btn">閉じる</button>
        <button type="submit" class="primary-btn">担当変更する</button>
      </div>

    </div>

  </form>
</dialog>


<!-- キャンセル -->
<dialog id="shiftCancelDialog" class="request-dialog">
  <form id="shiftCancelForm" class="request-form">

    <div class="form-head">
      <strong>シフトキャンセル</strong>
      <button type="button" id="closeShiftCancelDialog" class="close-btn">×</button>
    </div>

    <div class="form-body">

      <div id="shiftCancelSummary" class="dialog-summary"></div>

      <label class="field">
        <span>キャンセル理由</span>
        <textarea id="shiftCancelReason" rows="3"></textarea>
      </label>

      <div class="form-actions">
        <button type="button" id="cancelShiftCancel" class="secondary-btn">閉じる</button>
        <button type="submit" class="danger-btn">キャンセルする</button>
      </div>

    </div>

  </form>
</dialog>


<!-- シフト詳細 -->
<dialog id="shiftDetailDialog" class="request-dialog">

  <div class="request-form">

    <div class="form-head">
      <strong>シフト詳細</strong>
      <button
        type="button"
        id="closeShiftDetailDialog"
        class="close-btn"
      >
        ×
      </button>
    </div>

    <div class="form-body">

      <div
        id="shiftDetailTitle"
        class="shift-detail-title"
      ></div>

      <div
        id="shiftDetailBody"
        class="shift-detail-body"
      ></div>

      <div class="form-actions">
        <button
          type="button"
          id="openShiftHistory"
          class="secondary-btn"
        >
          変更履歴
        </button>

        <button
          type="button"
          id="closeShiftDetailBottom"
          class="primary-btn"
        >
          閉じる
        </button>
      </div>

    </div>

  </div>

</dialog>


<!-- 変更履歴 -->
<dialog id="shiftHistoryDialog" class="request-dialog">

  <div class="request-form">

    <div class="form-head">
      <strong>変更履歴</strong>
      <button
        type="button"
        id="closeShiftHistoryDialog"
        class="close-btn"
      >
        ×
      </button>
    </div>

    <div class="form-body">

      <div
        id="shiftHistorySummary"
        class="history-summary"
      ></div>

      <div
        id="shiftHistoryList"
        class="history-list"
      ></div>

      <div class="form-actions">
        <button
          type="button"
          id="backToShiftDetail"
          class="secondary-btn"
        >
          詳細へ戻る
        </button>
      </div>

    </div>

  </div>

</dialog>



<!-- 週確定 -->
<dialog id="weekConfirmDialog" class="request-dialog">

  <form id="weekConfirmForm" class="request-form">

    <div class="form-head">
      <strong>週を確定</strong>

      <button
        type="button"
        id="closeWeekConfirmDialog"
        class="close-btn"
      >
        ×
      </button>
    </div>

    <div class="form-body">

      <div
        id="weekConfirmSummary"
        class="dialog-summary"
      ></div>

      <div class="week-confirm-note">
        週編成Wの現在の有効シフトを基本表Mへ登録し、
        週管理Rを「確定」にします。<br><br>
        シフトIDは変更しません。<br>
        テスト中は未ログインでも実行できます。
      </div>

      <div class="form-actions">

        <button
          type="button"
          id="cancelWeekConfirm"
          class="secondary-btn"
        >
          戻る
        </button>

        <button
          type="submit"
          id="submitWeekConfirm"
          class="primary-btn"
        >
          確定する
        </button>

      </div>

    </div>

  </form>

</dialog>


<script src="./js/request-view-config.js?v=20260831-01"></script>
<script src="./js/shift-view.js?v=20260831-08"></script>
</body>
</html>
