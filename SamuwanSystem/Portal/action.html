<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行動記録</title>
  <link rel="stylesheet" href="./css/common.css">
</head>
<body>
  <header class="app-header">
    <div>
      <div class="app-title">行動記録</div>
      <div id="staffName" class="staff-name"></div>
    </div>
    <button class="small-button" onclick="location.href='./index.html'">メインへ</button>
  </header>

  <main class="app-main">
    <section class="status-card">
      <h2>現在の支援状況</h2>
      <div id="currentStatus" class="current-status">取得中...</div>
      <div id="currentDetail" class="current-detail"></div>
    </section>

    <section class="card">
      <h2>行動</h2>
      <div class="action-stack">
        <button id="startButton" class="primary-button" type="button">向かいます</button>
        <button id="enterButton" class="primary-button" type="button">入りました</button>
        <button id="routeButton" class="secondary-button" type="button">行程記録</button>
        <button id="finishButton" class="danger-button" type="button">終わりました</button>
      </div>
      <div id="actionMessage" class="message" aria-live="polite"></div>
    </section>
  </main>

  <script src="./js/common.js"></script>
  <script src="./js/action.js"></script>
</body>
</html>
