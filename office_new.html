<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト表</title>
  <link rel="stylesheet" href="./office_new.css?v=20260808-3">
</head>
<body>
  <main class="shift-page">
    <header class="shift-header">
      <div>
        <h1>シフト表</h1>
        <p id="officeUserName">職員情報を確認しています</p>
      </div>
      <button id="openOfficeModalButton" class="office-launch-button hidden" type="button" onclick="openOfficeModal()">
        🏢 開閉
      </button>
    </header>

    <div id="officeAuthError" class="office-message office-error hidden">
      <strong>職員情報を確認できません</strong>
      <p>先に職員ポータルを開いて、本人登録を行ってください。</p>
      <a class="office-portal-link" href="./index.html">職員ポータルを開く</a>
    </div>

    <section id="shiftArea" class="shift-card hidden">
      <nav class="shift-tabs" aria-label="シフト週切替">
        <button id="shiftTabPrev" class="shift-tab" type="button" onclick="selectShiftTab('prev')">前週</button>
        <button id="shiftTabCurrent" class="shift-tab" type="button" onclick="selectShiftTab('current')">今週</button>
        <button id="shiftTabNext" class="shift-tab" type="button" onclick="selectShiftTab('next')">来週</button>
      </nav>

      <div class="shift-meta">
        <strong id="shiftTitle">シフトを読み込んでいます</strong>
        <span id="shiftUpdated"></span>
      </div>

      <div id="shiftLoading" class="shift-loading">
        <div class="office-spinner"></div>
        <span>シフトを読み込んでいます</span>
      </div>

      <div id="shiftEmpty" class="shift-empty hidden">この週のシフトPDFはありません。</div>

      <div id="shiftPdfTapArea" class="shift-pdf-wrap hidden" onclick="openShiftFullscreen()" role="button" tabindex="0" aria-label="シフトPDFを全画面表示">
        <div id="shiftPdfViewer" class="pdf-viewer"></div>
        <span class="shift-full-hint">タップで全画面表示</span>
      </div>
    </section>
  </main>

  <div id="officeModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="officeModalTitle">
    <div class="office-modal-card">
      <div class="modal-header">
        <div>
          <h2 id="officeModalTitle">事務所開閉</h2>
          <p>実際にシャッターを操作してから登録してください。</p>
        </div>
        <button class="modal-close" type="button" onclick="closeOfficeModal()" aria-label="閉じる">×</button>
      </div>

      <div id="officeActionArea" class="office-action-area">
        <button id="simpleOfficeOpenButton" class="office-main-button open-button" type="button" onclick="sendSimpleOfficeAction('シャッターを開けました')">
          <span class="button-icon">🔓</span>
          <span class="button-text">シャッターを<br>開けました</span>
        </button>

        <button id="simpleOfficeCloseButton" class="office-main-button close-button" type="button" onclick="sendSimpleOfficeAction('シャッターを閉めました')">
          <span class="button-icon">🔒</span>
          <span class="button-text">シャッターを<br>閉めました</span>
        </button>
      </div>

      <div id="officeSendingArea" class="office-message office-sending hidden">
        <div class="office-spinner"></div>
        <p>登録しています</p>
      </div>

      <div id="officeResultArea" class="office-message hidden"></div>
    </div>
  </div>

  <div id="shiftFullscreen" class="pdf-fullscreen hidden" role="dialog" aria-modal="true" aria-label="シフトPDF全画面表示">
    <button class="pdf-full-close" type="button" onclick="closeShiftFullscreen()">×</button>
    <div id="shiftFullViewer" class="pdf-viewer pdf-viewer-full"></div>
  </div>

  <script src="./common.js?v=20260801-3"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="./office_new.js?v=20260808-4"></script>
</body>
</html>
