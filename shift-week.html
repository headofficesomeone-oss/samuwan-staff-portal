<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基本シフト表</title>
  <link rel="stylesheet" href="shift-week.css?v=compact-transport-v1">
</head>
<body>
  <header class="app-header compact-header">
    <div class="header-title">
      <div class="app-name">訪問ケアぷーどる</div>
      <h1>基本シフト表</h1>
    </div>
    <div class="header-actions">
      <button id="reloadButton" class="secondary-button" type="button">再読み込み</button>
      <button id="createButton" class="secondary-button" type="button">初回作成</button>
      <a class="nav-link" href="./shift-master-v2.html">シフト規定値</a>
    </div>
  </header>

  <main class="page compact-page">
    <section id="weekControlCard" class="compact-toolbar">
      <button id="collapseWeekControlsButton" class="hidden" type="button">折りたたむ</button>
      <button id="previousWeekButton" class="toolbar-button" type="button">◀ 前の週</button>
      <input id="weekMonday" type="date">
      <button id="currentWeekButton" class="toolbar-button" type="button">今週</button>
      <button id="nextWeekButton" class="toolbar-button" type="button">次の週 ▶</button>
      <strong id="weekRange" class="week-range"></strong>

      <select id="staffFilter" class="toolbar-select">
        <option value="">担当者：全員</option>
      </select>

      <select id="weekdayFilter" class="toolbar-select compact-select">
        <option value="">曜日：すべて</option>
        <option value="月">月</option><option value="火">火</option>
        <option value="水">水</option><option value="木">木</option>
        <option value="金">金</option><option value="土">土</option>
        <option value="日">日</option>
      </select>

      <select id="sortOrder" class="toolbar-select sort-select">
        <option value="dateTime">並び替え：日付→時間</option>
        <option value="dateStaffTime">日付→主担当→時間</option>
        <option value="userDateTime">利用者→日付→時間</option>
      </select>

      <button id="instructionToggleButton" class="toolbar-button" type="button" aria-pressed="false">指示</button>
      <button id="newShiftButton" class="primary-button compact-add-button" type="button">＋予定追加</button>

      <button id="savePendingButton" class="toolbar-button pending-save-button hidden" type="button">
        変更を保存
      </button>
      <span id="pendingChangeCount" class="pending-change-count hidden"></span>

      <div class="toolbar-summary">
        <strong id="recordCount">0件</strong>
        <span id="cacheStatus" class="cache-status"></span>
      </div>
    </section>

    <section id="collapsedWeekBar" class="hidden">
      <strong id="collapsedWeekRange"></strong>
      <button id="expandWeekControlsButton" type="button">表示する</button>
    </section>

    <div id="messageArea" class="message-area hidden" role="status"></div>

    <section class="table-card compact-table-card">
      <div id="topScroll" class="top-scroll" aria-label="表の横スクロール">
        <div id="topScrollInner" class="top-scroll-inner"></div>
      </div>
      <div id="tableScroll" class="table-scroll">
        <table class="shift-table compact-shift-table">
          <colgroup>
            <col class="col-no">
            <col class="col-can">
            <col class="col-date">
            <col class="col-weekday">
            <col class="col-time-range">
            <col class="col-user">
            <col class="col-service">
            <col class="col-content">
            <col class="col-staff">
            <col class="col-staff">
            <col class="col-staff">
            <col class="col-staff">
            <col class="col-paid">
            <col class="col-vehicle">
            <col class="col-destination">
            <col class="col-status">
            <col class="col-detail">
          </colgroup>

          <thead>
            <tr>
              <th class="col-no center-heading">No.</th>
              <th class="col-can center-heading">中止</th>
              <th class="col-date center-heading">日付</th>
              <th class="col-weekday center-heading">曜</th>
              <th class="col-time-range center-heading">時間</th>
              <th class="col-user">利用者</th>
              <th class="col-service">サービス</th>
              <th class="col-content">内容</th>
              <th class="col-staff">主担当</th>
              <th class="col-staff">副担当</th>
              <th class="col-staff">担当3</th>
              <th class="col-staff">担当4</th>
              <th class="col-paid center-heading">有償</th>
              <th class="col-vehicle">車種</th>
              <th class="col-destination">行き先</th>
              <th class="col-status center-heading">状態</th>
              <th class="col-detail center-heading">詳細</th>
            </tr>
          </thead>
          <tbody id="shiftWeekBody"></tbody>
        </table>
      </div>
      <div id="emptyArea" class="empty-area hidden">この週の基本シフトはまだありません。</div>
    </section>
  </main>

  <!-- 詳細編集 -->
  <div id="shiftDetailModal" class="shift-modal hidden" aria-hidden="true">
    <div class="shift-modal-backdrop"></div>
    <div class="shift-modal-dialog compact-detail-dialog">
      <div class="shift-modal-header">
        <h2>シフト詳細</h2>
        <button id="closeDetailButton" class="modal-close-button" type="button">× 閉じる</button>
      </div>
      <form id="shiftDetailForm">
        <input id="detailShiftId" type="hidden">
        <div class="shift-modal-body detail-form-body">
          <div class="detail-line detail-line-four">
            <label>日付</label><input id="detailDate" type="date">
            <label>曜日</label><input id="detailWeekday" type="text" readonly>
            <label>開始</label><input id="detailStartTime" type="time">
            <label>終了</label><input id="detailEndTime" type="time">
          </div>

          <div class="detail-line detail-line-user">
            <label>利用者</label><input id="detailUser" type="text">
            <label>サービス</label><input id="detailService" type="text">
            <label>内容</label><input id="detailContent" type="text">
          </div>

          <div class="detail-line detail-line-staff">
            <label>担当</label><select id="detailStaff1"></select>
            <label>副</label><select id="detailStaff2"></select>
            <label>3</label><select id="detailStaff3"></select>
            <label>4</label><select id="detailStaff4"></select>
          </div>

          <div class="detail-line detail-line-move">
            <label>移動手段</label>
            <select id="detailTransport">
              <option value=""></option>
              <option>徒歩</option>
              <option>公共交通</option>
              <option>有償運送</option>
              <option>自家用車</option>
              <option>その他</option>
            </select>

            <label>行き先</label>
            <input id="detailDestination" type="text">

            <label>待合せ</label>
            <input id="detailMeeting" type="text">

            <label>合流</label>
            <input id="detailMeetingPoint" type="text">
          </div>

          <div class="detail-line detail-line-full">
            <label>予約情報</label>
            <input id="detailReservationInfo" type="text">
          </div>

          <div class="transport-section">
            <div class="transport-title">有償運送</div>

            <div class="paid-direction-row">
              <div class="direction-label">行き</div>
              <label>時刻</label>
              <input id="detailPaidGoTime" type="time">
              <label>出発地</label>
              <input id="detailPaidGoFrom" type="text">
              <label>運転手</label>
              <select id="detailPaidGoDriverNo">
                <option value=""></option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
              <label>車種</label>
              <input id="detailPaidGoVehicle" type="text">
            </div>

            <div class="paid-direction-row">
              <div class="direction-label">帰り</div>
              <label>時刻</label>
              <input id="detailPaidReturnTime" type="time">
              <label>出発地</label>
              <input id="detailPaidReturnFrom" type="text">
              <label>運転手</label>
              <select id="detailPaidReturnDriverNo">
                <option value=""></option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
              <label>車種</label>
              <input id="detailPaidReturnVehicle" type="text">
            </div>
          </div>

          <div class="transport-section pickup-inline-section">
            <div class="pickup-inline-row">
              <div class="pickup-title-inline">送迎</div>
              <label>時刻</label>
              <input id="detailPickupTime" type="time">
              <label>出発地</label>
              <input id="detailPickupFrom" type="text">
              <label>到着地</label>
              <input id="detailPickupTo" type="text">
              <label>運転手</label>
              <select id="detailPickupDriverNo">
                <option value=""></option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
              <label>車種</label>
              <input id="detailPickupVehicle" type="text">
            </div>
          </div>

          <div class="detail-line detail-line-full">
            <label>簡易メモ</label><input id="detailSimpleMemo" type="text">
          </div>
          <div class="detail-line detail-line-full">
            <label>詳細注意</label><textarea id="detailNote" rows="2"></textarea>
          </div>
          <div class="detail-line detail-line-full">
            <label>備考</label><textarea id="detailRemarks" rows="2"></textarea>
          </div>
        </div>
        <div class="shift-modal-footer">
          <button id="cancelDetailButton" class="secondary-button" type="button">取消</button>
          <button id="saveDetailButton" class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 個別新規追加：詳細ポップアップと同じレイアウト -->
  <div id="newShiftModal" class="shift-modal hidden" aria-hidden="true">
    <div class="shift-modal-backdrop"></div>
    <div class="shift-modal-dialog compact-detail-dialog">
      <div class="shift-modal-header">
        <h2>予定追加</h2>
        <button id="closeNewShiftButton" class="modal-close-button" type="button">× 閉じる</button>
      </div>

      <form id="newShiftForm">
        <div class="shift-modal-body detail-form-body">

          <div class="detail-line detail-line-four">
            <label>日付</label>
            <input id="newShiftDate" type="date" required>

            <label>曜日</label>
            <input id="newShiftWeekday" type="text" readonly>

            <label>開始</label>
            <input id="newShiftStartTime" type="time" required>

            <label>終了</label>
            <input id="newShiftEndTime" type="time" required>
          </div>

          <div class="detail-line detail-line-user">
            <label>利用者</label>
            <input id="newShiftUser" list="newShiftUserList" required>

            <label>サービス</label>
            <input id="newShiftService" list="newShiftServiceList" required>

            <label>内容</label>
            <input id="newShiftContent" type="text">
          </div>

          <div class="detail-line detail-line-staff">
            <label>担当</label>
            <select id="newShiftStaff1"></select>

            <label>副</label>
            <select id="newShiftStaff2"></select>

            <label>3</label>
            <select id="newShiftStaff3"></select>

            <label>4</label>
            <select id="newShiftStaff4"></select>
          </div>

          <div class="detail-line detail-line-move">
            <label>移動手段</label>
            <select id="newShiftTransport">
              <option value=""></option>
              <option>徒歩</option>
              <option>公共交通</option>
              <option>有償運送</option>
              <option>自家用車</option>
              <option>その他</option>
            </select>

            <label>行き先</label>
            <input id="newShiftDestination" type="text">

            <label>待合せ</label>
            <input id="newShiftMeeting" type="text">

            <label>合流</label>
            <input id="newShiftMeetingPoint" type="text">
          </div>

          <div class="detail-line detail-line-full">
            <label>予約情報</label>
            <input id="newShiftReservationInfo" type="text">
          </div>

          <div class="transport-section">
            <div class="transport-title">有償運送</div>

            <div class="paid-direction-row">
              <div class="direction-label">行き</div>
              <label>時刻</label>
              <input id="newShiftPaidGoTime" type="time">

              <label>出発地</label>
              <input id="newShiftPaidGoFrom" type="text">

              <label>運転手</label>
              <select id="newShiftPaidGoDriverNo">
                <option value=""></option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>

              <label>車種</label>
              <input id="newShiftPaidGoVehicle" type="text">
            </div>

            <div class="paid-direction-row">
              <div class="direction-label">帰り</div>
              <label>時刻</label>
              <input id="newShiftPaidReturnTime" type="time">

              <label>出発地</label>
              <input id="newShiftPaidReturnFrom" type="text">

              <label>運転手</label>
              <select id="newShiftPaidReturnDriverNo">
                <option value=""></option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>

              <label>車種</label>
              <input id="newShiftPaidReturnVehicle" type="text">
            </div>
          </div>

          <div class="transport-section pickup-inline-section">
            <div class="pickup-inline-row">
              <div class="pickup-title-inline">送迎</div>

              <label>時刻</label>
              <input id="newShiftPickupTime" type="time">

              <label>出発地</label>
              <input id="newShiftPickupFrom" type="text">

              <label>到着地</label>
              <input id="newShiftPickupTo" type="text">

              <label>運転手</label>
              <select id="newShiftPickupDriverNo">
                <option value=""></option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>

              <label>車種</label>
              <input id="newShiftPickupVehicle" type="text">
            </div>
          </div>

          <div class="detail-line detail-line-full">
            <label>簡易メモ</label>
            <input id="newShiftSimpleMemo" type="text">
          </div>

          <div class="detail-line detail-line-full">
            <label>詳細注意</label>
            <textarea id="newShiftDetailNote" rows="2"></textarea>
          </div>

          <div class="detail-line detail-line-full">
            <label>備考</label>
            <textarea id="newShiftNote" rows="2"></textarea>
          </div>

          <div id="newShiftFormMessage" class="message-area hidden"></div>
        </div>

        <div class="shift-modal-footer">
          <button id="cancelNewShiftButton" class="secondary-button" type="button">取消</button>
          <button id="saveNewShiftButton" class="primary-button" type="submit">登録</button>
        </div>
      </form>

      <datalist id="newShiftUserList"></datalist>
      <datalist id="newShiftServiceList"></datalist>
    </div>
  </div>

  <script src="shift-week.js?v=reload-guard-v7"></script>
</body>
</html>
