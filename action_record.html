<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>行動記録</title>
  <link rel="stylesheet" href="./index.css?v=20260810-actionrecord-1">
  <link rel="stylesheet" href="./action_record.css?v=20260810-1">
</head>
<body>
  <header class="record-header">
    <button class="record-back" type="button" onclick="returnToPortal_()">‹</button>
    <div>
      <div class="record-title">行動記録</div>
      <div id="recordHelperName" class="record-helper"></div>
    </div>
    <span id="recordStateBadge" class="record-state-badge">確認中</span>
  </header>

  <main class="record-page">
    <section class="record-support-card">
      <div id="recordService" class="record-service">―</div>
      <div id="recordClient" class="record-client">―</div>
      <div id="recordSchedule" class="record-schedule">―</div>
    </section>

    <div id="recordMessage" class="record-message hidden"></div>

    <!-- 初回：開始場所 -->
    <section id="screenStart" class="record-screen hidden">
      <div class="record-card">
        <h1 id="startTitle">支援開始・出発</h1>
        <p id="startLead" class="record-lead">
          最初の場所と移動方法を確認して登録します。
        </p>

        <label class="record-label" for="startPlace">最初の場所</label>
        <div class="input-with-action">
          <input id="startPlace" type="text" placeholder="例：利用者宅、川越駅">
          <button type="button" onclick="startVoiceInput_('startPlace')">🎤</button>
        </div>

        <div id="normalTransportFields">
          <label class="record-label" for="startTransport">移動手段</label>
          <select id="startTransport" onchange="toggleDriverField_('start')">
            <option value="徒歩">徒歩</option>
            <option value="公共交通">公共交通</option>
            <option value="有償運送">有償運送</option>
            <option value="自家用車">自家用車</option>
            <option value="その他">その他</option>
          </select>

          <div id="startDriverWrap" class="hidden">
            <label class="record-label" for="startDriver">運転手</label>
            <select id="startDriver">
              <option value="">選択してください</option>
              <option value="自分">自分</option>
              <option value="他職員">他職員</option>
            </select>
          </div>
        </div>

        <div id="paidTransportNote" class="record-note hidden">
          有償運送として登録します。運転手は自分として記録します。
        </div>

        <button id="startRegisterButton" class="record-primary" type="button" onclick="registerInitialDeparture_()">
          支援開始・出発を登録
        </button>
      </div>
    </section>

    <!-- 移動中：カメラ / 手入力 -->
    <section id="screenMove" class="record-screen hidden">
      <div class="record-card">
        <div class="record-card-head">
          <div>
            <h1>移動行程</h1>
            <p class="record-lead">到着した場所を記録します。</p>
          </div>
          <span class="record-mini-badge">移動中</span>
        </div>

        <div class="mode-tabs">
          <button id="cameraTab" class="active" type="button" onclick="switchInputMode_('camera')">📷 カメラ</button>
          <button id="manualTab" type="button" onclick="switchInputMode_('manual')">✍ 手入力</button>
        </div>

        <div id="cameraPane">
          <div class="camera-box">
            <video id="cameraVideo" autoplay playsinline class="hidden"></video>
            <canvas id="cameraCanvas" class="hidden"></canvas>
            <div id="cameraPlaceholder" class="camera-placeholder">
              <div>📷</div>
              <p>到着場所が分かるように撮影します</p>
            </div>
          </div>

          <button id="cameraStartButton" class="record-secondary" type="button" onclick="startCamera_()">カメラを起動</button>
          <button id="cameraCaptureButton" class="record-primary hidden" type="button" onclick="capturePhoto_()">写真を撮る</button>
        </div>

        <div id="manualPane" class="hidden">
          <label class="record-label" for="manualPlace">到着場所</label>
          <div class="input-with-action">
            <input id="manualPlace" type="text" placeholder="例：かつや 川越的場店">
            <button type="button" onclick="startVoiceInput_('manualPlace')">🎤</button>
          </div>
          <label class="record-label" for="manualNote">メモ（任意）</label>
          <textarea id="manualNote" rows="3" placeholder="必要な場合だけ入力"></textarea>
          <button class="record-primary" type="button" onclick="prepareManualConfirm_()">確認へ</button>
        </div>
      </div>
    </section>

    <!-- 到着確認 -->
    <section id="screenConfirm" class="record-screen hidden">
      <div class="record-card">
        <h1>到着内容の確認</h1>
        <div id="photoPreview" class="photo-preview hidden"></div>

        <label class="record-label" for="confirmPlace">到着場所</label>
        <div class="input-with-action">
          <input id="confirmPlace" type="text">
          <button type="button" onclick="startVoiceInput_('confirmPlace')">🎤</button>
        </div>

        <label class="record-label" for="confirmNote">メモ（任意）</label>
        <textarea id="confirmNote" rows="3"></textarea>

        <div id="photoAnalysisNote" class="record-note hidden">
          写真は撮影できています。AIによる店舗名の自動判定は次の段階で接続します。
        </div>

        <div class="record-button-row">
          <button class="record-secondary" type="button" onclick="showMoveScreen_()">戻る</button>
          <button class="record-primary" type="button" onclick="registerArrival_()">到着を登録</button>
        </div>
      </div>
    </section>

    <!-- 到着後 -->
    <section id="screenAtPlace" class="record-screen hidden">
      <div class="record-card">
        <div class="record-card-head">
          <div>
            <h1 id="currentPlaceTitle">到着場所</h1>
            <p id="arrivalInfo" class="record-lead"></p>
          </div>
          <span class="record-mini-badge waiting">滞在中</span>
        </div>

        <button class="record-primary" type="button" onclick="openDepartureScreen_()">🚶 出発</button>
        <button class="record-secondary danger-outline" type="button" onclick="finishOutingAtCurrentPlace_()">■ 支援終了</button>

        <button class="record-link-button" type="button" onclick="toggleTransportChange_()">移動手段を変更</button>

        <div id="transportChangeBox" class="record-subbox hidden">
          <label class="record-label" for="changedTransport">次の移動手段</label>
          <select id="changedTransport" onchange="toggleChangedDriver_()">
            <option value="徒歩">徒歩</option>
            <option value="公共交通">公共交通</option>
            <option value="有償運送">有償運送</option>
            <option value="自家用車">自家用車</option>
            <option value="その他">その他</option>
          </select>
          <div id="changedDriverWrap" class="hidden">
            <label class="record-label" for="changedDriver">運転手</label>
            <select id="changedDriver">
              <option value="">選択してください</option>
              <option value="自分">自分</option>
              <option value="他職員">他職員</option>
            </select>
          </div>
          <button class="record-secondary" type="button" onclick="applyTransportChange_()">変更する</button>
        </div>
      </div>
    </section>

    <!-- 次の出発 -->
    <section id="screenDeparture" class="record-screen hidden">
      <div class="record-card">
        <h1>出発</h1>
        <p class="record-lead">
          <strong id="departureFromPlace"></strong> から出発します。
        </p>

        <label class="record-label" for="nextTransport">移動手段</label>
        <select id="nextTransport" onchange="toggleDriverField_('next')">
          <option value="徒歩">徒歩</option>
          <option value="公共交通">公共交通</option>
          <option value="有償運送">有償運送</option>
          <option value="自家用車">自家用車</option>
          <option value="その他">その他</option>
        </select>

        <div id="nextDriverWrap" class="hidden">
          <label class="record-label" for="nextDriver">運転手</label>
          <select id="nextDriver">
            <option value="">選択してください</option>
            <option value="自分">自分</option>
            <option value="他職員">他職員</option>
          </select>
        </div>

        <div class="record-button-row">
          <button class="record-secondary" type="button" onclick="showAtPlace_()">戻る</button>
          <button class="record-primary" type="button" onclick="registerNextDeparture_()">出発を登録</button>
        </div>
      </div>
    </section>

    <!-- 帰宅 -->
    <section id="screenHome" class="record-screen hidden">
      <div class="record-card">
        <h1>帰宅</h1>
        <p class="record-lead">利用者宅への到着として登録します。</p>
        <div class="home-box">🏠 利用者宅</div>
        <div class="record-button-row stack">
          <button class="record-primary" type="button" onclick="registerHome_(false)">帰宅を登録</button>
          <button class="record-secondary danger-outline" type="button" onclick="registerHome_(true)">帰宅して支援終了</button>
        </div>
      </div>
    </section>
  </main>

  <script src="./common.js?v=20260810-1"></script>
  <script src="./action_record.js?v=20260810-2"></script>
</body>
</html>
